# All model names and thresholds live here (CLAUDE.md: never hardcode them).

llm:
  base_url: http://localhost:11434/v1   # overridden by OLLAMA_BASE_URL if set
  timeout_s: 300
  max_retries: 3
  backoff_s: 1.0            # doubles each retry
  reasoning_effort: none    # "none" turns thinking off (qwen3.5: ~35 vs ~1,900 tokens per call)
  max_tokens: 3500          # reply cap; prompt budget + this must fit the context window

# Sampling temperature per agent (by agent name). Agents not listed use the model's default.
temperature:
  labeler_a: 0
  labeler_b: 0
  labeler_c: 0
  ocr_agent: 0
  verifier: 0
  rule_writer: 0.2
  diagnoser: 0.2
  orchestrator: 0.2
  toy_calculator: 0
  toy_skill: 0
  toy_reader: 0
  toy_approval: 0

harness:
  tool_result_max_chars: 2000
  context_keep_turns: 4        # turns kept whole when compacting (SPEC: "last N turns")
  # Context window Ollama actually serves per model (checked with `ollama ps`).
  # The server default is 4096 unless the model tag or OLLAMA_CONTEXT_LENGTH sets more.
  # An agent's budget must stay below its model's window, or Ollama silently drops the start.
  context_window:
    default: 4096
    gemma4:12b-16k: 16384
    qwen3.5:4b-8k: 8192
    nemotron-3-nano:4b-8k: 8192
    llama3.2:3b-8k: 8192
    gemma4:12b-8k: 8192
    llama3.1:8b-8k: 8192
  prompt_warn_fraction: 0.8    # warn when the opening prompt + skills exceed this share of the budget
  runs_dir: runs

# VRAM guard (rulebook/harness/memory.py). Out-of-memory can take the desktop down, so:
# one model loaded at a time, and a model only loads if free VRAM >= estimate + headroom.
# Estimates = weights + KV cache at the tag's context + ~1 GB compute buffers, calculated
# from `ollama show -v` (2026-11-08). A model without an estimate is refused.
memory:
  headroom_gb: 1.5
  estimate_gb:
    qwen3.5:4b: 4.5              # 3.4 + KV 0.13 @4k (8 of 32 layers attend)
    qwen3.5:4b-8k: 4.7           # 3.4 + KV 0.25 @8k
    nemotron-3-nano:4b-8k: 3.9   # 2.8 + KV 0.13 @8k (4 of 42 layers attend)
    llama3.2:3b-8k: 3.9          # 2.0 + KV 0.88 @8k (all 28 layers)
    gemma4:12b-16k: 9.8          # 8.0 + KV ~0.75 @16k (8 global + 40 sliding-window layers)
    gemma4:12b-8k: 9.6           # 8.0 + KV ~0.6 @8k (global 0.13 + sliding window 0.47)
    llama3.1:8b-8k: 6.9          # 4.9 + KV 1.0 @8k (32 layers x 8 kv heads x 128)

models:
  # Chosen 2026-11-08: three small models from different families, ~8-9 GB total,
  # so all three fit in VRAM at once (see DECISIONS.md).
  labelers:   # -8k tags = same weights with num_ctx 8192 (Modelfile, created 2026-11-08)
    labeler_a: qwen3.5:4b-8k
    labeler_b: llama3.1:8b-8k     # replaced nemotron-3-nano:4b-8k (2026-11-08, after the 20-receipt runs)
    labeler_c: gemma4:12b-8k      # replaced llama3.2:3b-8k (2026-11-08)
  # Chosen 2026-11-08 (user left the choice to Claude): installed, supports tools and vision.
  orchestrator: gemma4:12b-16k   # also diagnoser, rule writer, verifier (16k context)
  vision: gemma4:12b-16k         # same model as the orchestrator, so no extra load
  embedding: nomic-embed-text   # spec default; not pulled yet, needed from M5
  toy_agent: qwen3.5:4b         # M2 calculator agent

verifier:
  # Simple defaults; tune at M8.
  max_gold_accuracy_drop: 0.01   # reject a patch if gold-set accuracy drops by more than this
  min_cluster_alpha_gain: 0.05   # SPEC section 4 revert rule
  # Patches on classes with no gold lines are marked "not gold-verified".

ocr:   # PaddleOCR on CPU (no VRAM), local models copied from crumb, offline
  model_dir: models/ocr
  det_model: PP-OCRv6_small_det
  rec_model: PP-OCRv6_small_rec
  cpu_threads: 4

labeling:
  chunk_lines: 20        # lines per labeler call (decided 2026-11-08)
  other_label: other     # text CORD doesn't label; excluded from accuracy vs v2

storage:
  db_path: rulebook.db

sum_check:
  tolerance: 0.01   # SPEC section 2: within 1%

data:
  dataset: naver-clova-ix/cord-v2
  splits:
    work: train
    gold: validation
    eval: test
  gold_receipt_count: 30
  gold_seed: 0
  # Frozen output of rulebook.data.gold.select_gold_receipts(30, gold_seed).
  gold_receipt_ids:
    - validation_0002
    - validation_0010
    - validation_0013
    - validation_0018
    - validation_0019
