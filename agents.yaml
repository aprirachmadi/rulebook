# Agents (SPEC section 3). `model` is a key path into config.yaml `models`, never a model name.
# System prompts are written with each agent's milestone (M4-M6); an agent without one
# cannot be built yet.

defaults:
  max_steps: 10
  # Token budget (chars / 4) per call. Must stay below the model's context window, leaving
  # room for the reply: labelers 6000 of 8192, gemma4:12b-16k agents 14000 of 16384.
  budget: 14000

agents:
  ocr_agent:
    model: vision
    tools: [run_paddleocr, crop_line, vlm_read_crop, sum_check]
    skills: [indonesian-receipt-format]
  labeler_a:
    model: labelers.labeler_a
    budget: 6000
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: [get_receipt_context]
    skills: [cord-guideline]
    output_schema: LabelBatch
  labeler_b:
    model: labelers.labeler_b
    budget: 6000
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: [get_receipt_context]
    skills: [cord-guideline]
    output_schema: LabelBatch
  labeler_c:
    model: labelers.labeler_c
    budget: 6000
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: [get_receipt_context]
    skills: [cord-guideline]
    output_schema: LabelBatch
  diagnoser:
    model: orchestrator
    tools: [get_cluster, get_votes, get_ocr_conf, sum_check, search_similar_lines]
    skills: [disagreement-taxonomy, cord-guideline]
  rule_writer:
    model: orchestrator
    tools: [get_cluster, search_similar_lines, get_guideline]
    skills: [guideline-style, cord-guideline]
  verifier:
    model: orchestrator
    tools: [simulate_patch, compute_alpha, run_gold_set, diff_labels]
    skills: [stats-checks]
  orchestrator:
    model: orchestrator
    tools: [delegate, list_clusters, request_human, apply_patch, relabel]
    skills: []
