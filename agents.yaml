# Agents (SPEC section 3). `model` is a key path into config.yaml `models`, never a model name.
# System prompts are written with each agent's milestone (M4-M6); an agent without one
# cannot be built yet.

defaults:
  max_steps: 10
  # Token budget (chars / 4) per call. Must stay below the model's context window, leaving
  # room for the reply: labelers 3000 + 4800 of 8192, gemma agents 12500 + 3500 of 16384.
  # Note: chars/4 (SPEC) underestimated real labeler prompts ~2x; the loop also checks real counts.
  budget: 12500

# Shared by the three labelers. {LABELS} is replaced with the label space at run time.
# Task mechanics only: every labeling rule comes from the guideline (cord-guideline skill).
labeler_prompt: &labeler_prompt |
  You label the words on an Indonesian shop receipt, following the labeling guideline below.

  You get the receipt as numbered lines. Each line shows its index in brackets, its rough
  position (x, y from 0 to 100), then its words, each with a number, like 0:Nasi 1:Goreng.

  Give every word of every line exactly one label from this list:
  {LABELS}

  Use "other" for text that is not a receipt field, such as the store name, address,
  date, cashier name, or footer.

  Group neighbouring words in the same line that share a label into one span.
  For each span give: line_idx, words (the word numbers), label, and confidence (0 to 1,
  how sure you are). Add a reason (at most 5 words) only when confidence is below 0.7.
  Use the guideline. If no rule fits a word, still pick the closest label and give a low
  confidence. Copy numbers as they are; never convert or calculate them.

  You may get only part of the receipt; label exactly the lines (and words) you are shown.

  Answer with JSON only: {"labels": [{"line_idx": 0, "words": [0, 1], "label": "...",
  "confidence": 0.9}]}

agents:
  ocr_agent:
    model: vision
    tools: [run_paddleocr, crop_line, vlm_read_crop, sum_check]
    skills: [indonesian-receipt-format]
  labeler_a:
    model: labelers.labeler_a
    system_prompt: *labeler_prompt
    budget: 3000
    max_tokens: 4800       # 71-line receipt needed ~3,200; real prompt up to ~3,250 (nemotron)
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: []              # SPEC lists get_receipt_context; the receipt is in the prompt instead
    skills: [cord-guideline]
    output_schema: LabelBatch
  labeler_b:
    model: labelers.labeler_b
    system_prompt: *labeler_prompt
    budget: 3000
    max_tokens: 4800       # 71-line receipt needed ~3,200; real prompt up to ~3,250 (nemotron)
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: []              # SPEC lists get_receipt_context; the receipt is in the prompt instead
    skills: [cord-guideline]
    output_schema: LabelBatch
  labeler_c:
    model: labelers.labeler_c
    system_prompt: *labeler_prompt
    budget: 3000
    max_tokens: 4800       # 71-line receipt needed ~3,200; real prompt up to ~3,250 (nemotron)
    preload_skills: true   # guideline goes in the system prompt; no tool call needed
    tools: []              # SPEC lists get_receipt_context; the receipt is in the prompt instead
    skills: [cord-guideline]
    output_schema: LabelBatch
  diagnoser:
    model: orchestrator
    tools: [get_cluster, get_votes, get_ocr_conf, sum_check, search_similar_lines]
    skills: [disagreement-taxonomy, cord-guideline]
  rule_writer:
    model: orchestrator
    tools: [get_cluster, search_similar_lines, get_guideline]
    skills: [guideline-style, cord-guideline]
  verifier:
    model: orchestrator
    tools: [simulate_patch, compute_alpha, run_gold_set, diff_labels]
    skills: [stats-checks]
  orchestrator:
    model: orchestrator
    tools: [delegate, list_clusters, request_human, apply_patch, relabel]
    skills: []
